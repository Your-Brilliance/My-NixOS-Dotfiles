################
### MONITORS ###
################

monitor = eDP-1, 2560x1600@90, 0x0, 1.33333

###################
### MY PROGRAMS ###
###################

# Set programs that you use
$terminal = foot
$fileManager = yazi
$menu = wofi --show drun
$reload_waybar = pkill waybar; waybar &

#################
### AUTOSTART ###
#################
 
 exec-once = waybar &
 exec-once = hyprpaper &
 exec-once = hypridle
 exec-once = wl-clip-persist --clipboard regular
 exec-once = systemctl --user start hyprpolkitagent

 # Just for the waybar I'm stealing for now lol
 exec-once = nm-applet --indicator &
 exec-once = blueman-applet &


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = GTK_THEME,Tokyo-Night-Dark
env = GTK_ICON_THEME,Adwaita
env = XCURSOR_THEME,Adwaita

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

#####################
### LOOK AND FEEL ###
#####################

source = ~/.cache/wal/colors-hyprland.conf

general {

    gaps_in = 5
    gaps_out = 5
    border_size = 3

    col.active_border = $color2 $color4 45deg
    col.inactive_border = $color3

    resize_on_border = false
    allow_tearing = false

    layout = dwindle
}

debug {
    vfr = false #fireboy-watergirl
}

render {
    direct_scanout = false
}

exec-once = wal -R

decoration {

    rounding = 12
    rounding_power = 4.0
    active_opacity = 0.75 
    inactive_opacity = 0.75


blur {
    enabled = true
    size = 2
    passes = 2
    new_optimizations = true
    vibrancy = 0.9
    vibrancy_darkness = 0.1
}

}

animations {
    enabled = true


    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

device {
    name = elan3233:00-04f3:4397
    enabled = false
}

input {
  touchpad {
    natural_scroll = true
    clickfinger_behavior = true
    tap-to-click = true
  }
  follow_mouse = 1
  numlock_by_default = true
}

#Fixes graininess for onlyoffice and omnissa
xwayland { 
  force_zero_scaling = true
}


###################
### KEYBINDINGS ###
###################


$mainMod = SUPER # Sets "Windows" key as main modifier

#Where to store the screenshots
env = HYPRSHOT_DIR, /home/karanxs/Pictures/Screenshots
#Screenshot a window
bind = CTRL SHIFT, 0, exec, hyprshot -m window --current
bind = CTRL SHIFT, KP_INSERT, exec, hyprshot -m window --current
# Screenshot a monitor
bind = CTRL SHIFT, 3, exec, hyprshot -m output --current
bind = CTRL SHIFT, KP_NEXT, exec, hyprshot -m output --current
# Screenshot a region
bind = CTRL SHIFT, S, exec, hyprshot -m region

bind = $mainMod, I, exec, hyprpicker -a 

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, P, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, B, exec, hyprctl dispatch maximize && (pkill waybar || waybar)
bind = $mainMod, SPACE, exec, pkill rofi ||  rofi -show drun
bind = $mainMod, L, exec, pidof hyprlock || hyprlock
bind = $mainMod, K, exec, pkill wlogout || wlogout
bind = $mainMod, N, exec, swaync-client -t -sw

# Move window with Super + Left Click
bindm = SUPER, mouse:272, movewindow

# Resize window with Super + Right Click
bindm = SUPER, mouse:273, resizewindow

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, KP_End, workspace, 1
bind = $mainMod, KP_Down, workspace, 2
bind = $mainMod, KP_Next, workspace, 3
bind = $mainMod, KP_Left, workspace, 4
bind = $mainMod, KP_Begin, workspace, 5
bind = $mainMod, KP_Right, workspace, 6
bind = $mainMod, KP_Home, workspace, 7
bind = $mainMod, KP_Up, workspace, 8
bind = $mainMod, KP_Prior, workspace, 9
bind = $mainMod, KP_Insert, workspace, 10

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, KP_End, movetoworkspace, 1
bind = $mainMod SHIFT, KP_Down, movetoworkspace, 2
bind = $mainMod SHIFT, KP_Next, movetoworkspace, 3
bind = $mainMod SHIFT, KP_Left, movetoworkspace, 4
bind = $mainMod SHIFT, KP_Begin, movetoworkspace, 5
bind = $mainMod SHIFT, KP_Right, movetoworkspace, 6
bind = $mainMod SHIFT, KP_Home, movetoworkspace, 7
bind = $mainMod SHIFT, KP_Up, movetoworkspace, 8
bind = $mainMod SHIFT, KP_Prior, movetoworkspace, 9
bind = $mainMod SHIFT, KP_Insert, movetoworkspace, 10

bind = $mainMod SHIFT,  1, movetoworkspace, 1
bind = $mainMod SHIFT,  2, movetoworkspace, 2
bind = $mainMod SHIFT,  3, movetoworkspace, 3
bind = $mainMod SHIFT,  4, movetoworkspace, 4
bind = $mainMod SHIFT,  5, movetoworkspace, 5
bind = $mainMod SHIFT,  6, movetoworkspace, 6
bind = $mainMod SHIFT,  7, movetoworkspace, 7
bind = $mainMod SHIFT,  8, movetoworkspace, 8
bind = $mainMod SHIFT,  9, movetoworkspace, 9
bind = $mainMod SHIFT,  0, movetoworkspace, 10


bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bind = $mainMod, F, fullscreen, 0
bind = $mainMod, M, fullscreen, 1


# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brillo -q -A 5
bindel = ,XF86MonBrightnessDown, exec, brillo -q -U 5 
bind = $mainMod SHIFT, B, exec, brillo -S 40

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


##############################
### WINDOWS AND WORKSPACES ###
##############################

gesture = 3, horizontal, workspace

